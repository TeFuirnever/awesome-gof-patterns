name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate knowledge cards
      run: node pattern-diagnose/scripts/validate-knowledge.mjs

    - name: Build smell catalog
      run: |
        node pattern-diagnose/scripts/build-smell-catalog.mjs
        # Verify catalog was generated
        test -f pattern-diagnose/references/smell-catalog.json
        echo "Smell catalog generated successfully"

    - name: Check loading budget
      run: |
        SKILL_SIZE=$(wc -c < pattern-diagnose/SKILL.md)
        echo "SKILL.md size: $SKILL_SIZE bytes (~$((SKILL_SIZE / 4)) tokens)"
        # Budget is 8000 tokens, using chars/4 as estimate
        if [ $((SKILL_SIZE / 4)) -gt 8000 ]; then
          echo "FAIL: SKILL.md exceeds 8000 token budget"
          exit 1
        fi
        echo "PASS: loading budget within limits"

  validate-examples:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check Python syntax
      run: |
        for f in $(find pattern-diagnose/assets/examples -name "*.py"); do
          python -m py_compile "$f" || exit 1
        done
        echo "All Python examples pass syntax check"

    - name: Check SPDX headers
      run: |
        FAIL=0
        for f in $(find pattern-diagnose/assets/examples -name "*.ts" -o -name "*.py" -o -name "*.go"); do
          if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
            echo "FAIL: missing SPDX header in $f"
            FAIL=1
          fi
        done
        exit $FAIL

  check-secrets:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        grep -rn "api_key\|secret_key\|password\s*=" --include="*.ts" --include="*.py" --include="*.go" --include="*.mjs" . || echo "No secrets found"

  eval-scripts:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'evals/package-lock.json'

    - name: Install dependencies
      working-directory: ./evals
      run: npm ci

    - name: Lint eval scripts
      run: node -c evals/scripts/*.mjs

    - name: Validate power analysis
      working-directory: ./evals
      run: npm run power-analysis
