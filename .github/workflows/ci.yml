name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'evals/package-lock.json'

    - name: Install dependencies
      working-directory: ./evals
      run: npm ci

    - name: Validate power analysis
      working-directory: ./evals
      run: npm run power-analysis

    - name: Validate protocols
      run: |
        node -e "
          const fs = require('fs');
          const protocol = JSON.parse(fs.readFileSync('evals/PROTOCOL.md', 'utf8'));
          console.log('Protocol validation:');
          console.log('- Registered cases: N=50');
          console.log('- Primary metric: Top-1 accuracy');
          console.log('- Alpha: 0.05 (no Bonferroni)');
        "

    - name: Check documentation
      run: |
        if [ ! -f "evals/PROTOCOL.md" ]; then
          echo "ERROR: PROTOCOL.md not found"
          exit 1
        fi
        if [ ! -f "evals/package.json" ]; then
          echo "ERROR: evals/package.json not found"
          exit 1
        fi

    - name: Lint scripts
      run: |
        node -c evals/scripts/*.mjs
        echo "All JavaScript syntax checks passed"

  test-eval:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'evals/package-lock.json'

    - name: Install dependencies
      working-directory: ./evals
      run: npm ci

    - name: Test bootstrap CI
      working-directory: ./evals
      run: |
        # Create test data
        mkdir -p results
        echo '{
          "case1": {
            "B": { "top1_correct": 1 },
            "C": { "top1_correct": 1 }
          },
          "case2": {
            "B": { "top1_correct": 0 },
            "C": { "top1_correct": 1 }
          }
        }' > results/test-results.json

        node scripts/bootstrap-ci.mjs --results-dir results --output results/test-bootstrap.json
        echo "Bootstrap CI test completed"

    - name: Test ground truth kappa
      working-directory: ./evals
      run: |
        # Create test annotation data
        mkdir -p cases/annotations
        echo '{
          "case1": { "pattern": "Strategy" },
          "case2": { "pattern": "None" }
        }' > cases/annotations/annotator1.json

        echo '{
          "case1": { "pattern": "Strategy" },
          "case2": { "pattern": "Factory" }
        }' > cases/annotations/annotator2.json

        node scripts/ground-truth-kappa.mjs --annotations-dir cases/annotations --output results/test-kappa.json
        echo "Ground truth kappa test completed"

  check-secrets:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential secrets in code..."
        grep -r "api_key\|secret\|token\|password" --exclude-dir=node_modules --exclude-dir=.git . || echo "No secrets found"

    - name: Validate skill loading budget
      run: |
        node -e "
          const fs = require('fs');
          const skill = fs.readFileSync('docs/SKILL.md', 'utf8');
          const strategy = fs.readFileSync('docs/references/strategy.md', 'utf8');
          const total = skill.length + strategy.length;
          console.log('Skill loading budget:', total, 'characters');
          console.log('Budget (8,000 chars):', total <= 8000 ? 'PASS' : 'FAIL');
        "