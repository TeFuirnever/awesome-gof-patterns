name: Pull Request
description: Template for pull requests
title: "[PR] "
body:
  - type: markdown
    attributes:
      value: |
        ## Description
        <!-- Provide a clear and concise description of the changes -->
        <!-- Link any relevant issues -->

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe your changes in detail
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the [Contributing Guidelines](../CONTRIBUTING.md)
          required: true
        - label: I have updated the [CHANGELOG.md](../CHANGELOG.md)
          required: true
        - label: I have run the tests locally
          required: true
        - label: I have added tests for my changes
          required: false
        - label: My changes follow the project's coding style
          required: true
        - label: I have included necessary documentation
          required: false

  - type: textarea
    id: testing
    attributes:
      label: Testing Instructions
      description: Provide steps to test your changes
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: issues
    attributes:
      label: Related Issues
      description: List any related issues using #issue-number
      placeholder: Closes: #