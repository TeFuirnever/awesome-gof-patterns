name: Bug Report
description: Report a bug in awesome-gof-patterns
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run '...'
        2. Do '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: Expected ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened
      placeholder: Actual ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system, Node.js version, etc.
      placeholder: "OS: Windows 10, Node.js: 20.0.0"
    validations:
      required: true

  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Is the bug consistently reproducible?
      placeholder: Always / Sometimes / Never
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Add anything else...